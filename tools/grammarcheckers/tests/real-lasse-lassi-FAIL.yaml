Config:
  Spec: ../pipespec.xml
  Variants: [smegram-dev]

Tests:
  - "Ovdamearkan čáhcevánddardeami lea vejolaš lasihit mearkkašahtti láhkai oalle unna lasse investeremiin."
  - "Dáid plána árvalusaid ollašuhttin mearkkaša (lasse) áigáiboahtovejolašvuođaid luondduealáhusbargiide ja eará báikegoddelaččaide, ee. oahpisteaddjin."
  - "Dalle sáhttá šaddat máksit dan lasse dikšuma masa lea dárbu, muhto lea vuoigatvuohta oažžut diehtit dakkaviđe go bátnedoavttir moaitá ahte haddi divru."
  - "Dain geat testejuvvo máŋgga háve máŋggaid jagiid, boahtá sullii ovttan njealjis leahkit PSA- árvu mii oalgguha lasse dutkamiidda."
  - "Dáhkádusgássa webbáikkis lea lasse informašuvdna divššus go lea olgoriikkas."
  - "Árvodáhkádusa sisdoalus ferte gávdnut lasse lohpádus liiggáš riektái mii dus juo lea ja máid láhka dadjá dahje mii juo lea juolluduvvon."
  - "Dáin dáhpáhusain oahpaheaddji sáhttá dáhttut mánnái lasse // liigeoahpahusa dahje // ja veahkehit su oahppodiimmuid áigge sierra giellaovdánahttinvugiiguin."
  - "Oahppi oahppodili ja oahppama galgá čuovvut ja juos vuhtto, ahte son ii ovdamearka dihte ovdán lohkamis dahje eará vuođđogálggain iežas ceahki // luohkkádási mielde, de dalle ferte dalán geahččalit váikkuhit áššái ja addit lasse // liigeoahpahusa dárbbu mielde."
  - "Suomagiela koloratiivavearba lea dávjá deskriptiivavearba, mii sáhttá leat maid suorggádus, mii sisttisdoal á kausatiiva-, frekventatiiva- dahje momentána lasse mearkkašupmi (Luttinen 2000: 10–11 ; Rääpysjärvi 2005: 53; Heikkinen &amp; Voutilainen 2009: 156–158 )."
  - "Ordinála lohkosátni Nubbi ja Goalmmát ovdamearusin sáhttá leat namahus lasse ládjui, man bearaš lea dárbbašan ja váldán atnui dahje man bearaš lea sáhttán árbet."

